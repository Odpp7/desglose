[package]
name = "desglose"
version = "0.1.0"
description = "Desglose: secuencias para alabanza"
authors = ["Oscar"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desglose_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"
rubato = "5.0.1"
rtrb = "0.4.1"
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "wav", "pcm", "mp3", "isomp4", "aac", "id3v2"] }
hound = "3.5.1"
signalsmith-stretch = "0.1.3"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "blocking", "multipart", "json"] }


# El cambio de velocidad es pesado: sin esto, en modo desarrollo no alcanza a correr en vivo.
[profile.dev.package.signalsmith-stretch]
opt-level = 3

# Las librerías (leer FLAC, convertir...) también optimizadas en desarrollo:
# sin esto, calcular las ondas de 10 pistas tarda varias veces más.
# Solo afecta a las librerías; nuestro código sigue compilando rápido.
[profile.dev.package."*"]
opt-level = 2

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
